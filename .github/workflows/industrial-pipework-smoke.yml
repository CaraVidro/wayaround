name: Industrial Pipework Client Smoke

on:
  push:
    branches:
      - feature/industrial-pipework-v1

jobs:
  client-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run client smoke
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          timeout 150s xvfb-run -a ./gradlew runClient --no-daemon > runclient.log 2>&1
          code=$?
          cat runclient.log

          if [ "$code" -eq 124 ]; then
            grep -Eqi "ModLauncher running" runclient.log || exit 1
            grep -Eqi "Backend library: LWJGL" runclient.log || exit 1
            grep -Eqi "Reloading ResourceManager" runclient.log || exit 1

            if grep -Eqi "Missing textures in model wayaround:(copper_tube|iron_service_pipe|steel_water_main|brass_gas_line|reinforced_gas_pipe|insulated_steam_pipe|floor_pipe_support|wall_pipe_bracket|hanging_pipe_support|mechanical_mill|mechanical_fan|mechanical_press|water_generator)|Unable to load model.*wayaround:(copper_tube|iron_service_pipe|steel_water_main|brass_gas_line|reinforced_gas_pipe|insulated_steam_pipe|floor_pipe_support|wall_pipe_bracket|hanging_pipe_support|mechanical_mill|mechanical_fan|mechanical_press|water_generator)|Exception.*(PipeRenderer|MechanicalMillRenderer|MechanicalFanRenderer|MechanicalPressRenderer|WaterGeneratorRenderer)" runclient.log; then
              echo "Industrial Pipework renderer/model resource error detected."
              exit 1
            fi

            echo "Industrial Pipework client smoke passed."
            exit 0
          fi

          exit "$code"
