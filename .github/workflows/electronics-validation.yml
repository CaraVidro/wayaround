name: Electronics foundation validation

on:
  pull_request:
    paths:
      - 'src/main/java/net/caravidro/wayaround/industrial/electronics/**'
      - 'src/main/java/net/caravidro/wayaround/industrial/client/ElectronicsWorkbenchScreen.java'
      - 'src/main/java/net/caravidro/wayaround/industrial/client/ElectronicsWorkbenchRenderer.java'
      - 'src/main/java/net/caravidro/wayaround/industrial/client/IndustrialClient.java'
      - 'src/main/java/net/caravidro/wayaround/network/CircuitWorkbenchActionC2SPayload.java'
      - 'src/main/java/net/caravidro/wayaround/network/WayAroundNetwork.java'
      - 'src/main/java/net/caravidro/wayaround/industrial/material/**'
      - 'src/main/java/net/caravidro/wayaround/industrial/engineering/**'
      - 'src/main/java/net/caravidro/wayaround/industrial/assembly/AssemblyItemData.java'
      - 'src/main/java/net/caravidro/wayaround/industrial/assembly/AssemblyPartTooltipEvents.java'
      - 'src/main/java/net/caravidro/wayaround/industrial/power/EnergyNetwork.java'
      - 'src/main/java/net/caravidro/wayaround/industrial/power/EnergyCableBlock.java'
      - 'src/main/resources/assets/wayaround/models/**/circuit_*'
      - 'src/main/resources/assets/wayaround/models/**/electronics_workbench*'
      - 'src/main/resources/assets/wayaround/blockstates/electronics_workbench.json'
      - 'src/main/resources/assets/wayaround/models/item/copper_trace.json'
      - 'src/main/resources/assets/wayaround/models/item/resistor.json'
      - 'src/main/resources/assets/wayaround/models/item/capacitor.json'
      - 'src/main/resources/assets/wayaround/models/item/diode.json'
      - 'src/main/resources/assets/wayaround/models/item/transistor.json'
      - 'src/main/resources/assets/wayaround/models/item/relay.json'
      - 'src/main/resources/assets/wayaround/models/item/input_terminal.json'
      - 'src/main/resources/assets/wayaround/models/item/output_terminal.json'
      - 'src/main/resources/assets/wayaround/blockstates/circuit_controller.json'
      - 'src/main/resources/data/wayaround/recipe/circuit_*'
      - 'src/main/resources/data/wayaround/recipe/copper_trace.json'
      - 'src/main/resources/data/wayaround/recipe/resistor.json'
      - 'src/main/resources/data/wayaround/recipe/capacitor.json'
      - 'src/main/resources/data/wayaround/recipe/diode.json'
      - 'src/main/resources/data/wayaround/recipe/transistor.json'
      - 'src/main/resources/data/wayaround/recipe/relay.json'
      - '.github/workflows/electronics-validation.yml'

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Material and circuit GameTests
        run: bash gradlew runCrushingGameTestServer --console=plain

      - name: Electronics client/resource smoke
        env:
          ALSOFT_DRIVERS: "null"
        shell: bash
        run: |
          python - <<'PYCLIENT'
          import os, re, signal, subprocess, time
          from pathlib import Path

          path = Path('electronics-client-smoke.log')
          ready = False

          with path.open('w') as log:
              process = subprocess.Popen(
                  ['xvfb-run', '-a', 'bash', 'gradlew', 'runClient', '--console=plain'],
                  stdout=log,
                  stderr=subprocess.STDOUT,
                  start_new_session=True,
              )
              try:
                  deadline = time.monotonic() + 180
                  while process.poll() is None and time.monotonic() < deadline:
                      text = path.read_text(errors='replace')
                      audio = 'OpenAL initialized' in text or 'Sound engine started' in text
                      if audio and 'minecraft:textures/atlas/gui.png-atlas' in text:
                          ready = True
                          break
                      time.sleep(1)
              finally:
                  if process.poll() is None:
                      os.killpg(process.pid, signal.SIGTERM)
                  try:
                      process.wait(timeout=15)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()

          text = path.read_text(errors='replace')

          if not ready or re.search(r'Exception in thread|ReportedException|ModLoadingException', text):
              print('\n'.join(text.splitlines()[-120:]))
              raise SystemExit(1)

          electronics = re.compile(
              r'wayaround:(?:models/(?:block|item)/)?'
              r'(?:electronics_workbench|circuit_controller|circuit_board|copper_trace|resistor|capacitor|'
              r'diode|transistor|relay|input_terminal|output_terminal)'
          )

          errors = [
              line for line in text.splitlines()
              if re.search(
                  r'Failed to load model|Unable to load model|Failed to create model|Missing textures in model',
                  line,
              )
          ]

          relevant = [line for line in errors if electronics.search(line)]

          if relevant:
              print('\n'.join(relevant))
              raise SystemExit(1)

          print('Electronics GameTests and client resource smoke reached a clean initialized state')
          PYCLIENT

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electronics-foundation-validation
          path: |
            electronics-client-smoke.log
            run/logs/latest.log
            build/reports/**
