name: Object Animation Client Smoke

on:
  push:
    branches:
      - feature/object-animation-system-v1

jobs:
  runclient-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Start NeoForge client
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          timeout 150s xvfb-run -a ./gradlew runClient --no-daemon > runclient.log 2>&1
          code=$?
          cat runclient.log

          if [ "$code" -eq 124 ]; then
            if grep -Eqi "ModLauncher running|Render thread|Backend library: LWJGL" runclient.log; then
              if grep -Eqi "Missing textures in model wayaround:mechanical_press|mechanical_press.*(Unable to load|Exception|missing model|error loading)" runclient.log; then
                echo "Mechanical press resources reported a load error."
                exit 1
              fi
              echo "runClient stayed alive through the animation smoke window."
              exit 0
            fi
            echo "runClient timed out before recognizable client startup."
            exit 1
          fi

          exit "$code"
