name: Crusher assembly validation
on:
  push:
    branches: [feature/assembly-crushers-v1, feature/mechanics-pipeflow-v1]
  pull_request:
    paths:
      - 'src/main/java/net/caravidro/wayaround/industrial/mechanical/**'
      - 'src/main/java/net/caravidro/wayaround/industrial/pipework/**'
      - 'src/main/java/net/caravidro/wayaround/industrial/crushing/**'
      - 'src/main/java/net/caravidro/wayaround/industrial/client/CrusherRenderer.java'
      - 'src/main/java/net/caravidro/wayaround/industrial/power/MechanicalMill*'
      - '.github/workflows/crusher-validation.yml'
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assembly GameTests on dedicated server
        run: bash gradlew runCrushingGameTestServer --console=plain
      - name: Client registration and resource smoke
        env:
          ALSOFT_DRIVERS: "null"
        shell: bash
        run: |
          python - <<'PYCLIENT'
          import os, re, signal, subprocess, time
          from pathlib import Path
          path = Path('client-smoke.log')
          ready = False
          with path.open('w') as log:
              process = subprocess.Popen(['xvfb-run', '-a', 'bash', 'gradlew', 'runClient', '--console=plain'],
                  stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
              try:
                  deadline = time.monotonic() + 180
                  while process.poll() is None and time.monotonic() < deadline:
                      text = path.read_text(errors='replace')
                      audio = 'OpenAL initialized' in text or 'Sound engine started' in text
                      if audio and 'minecraft:textures/atlas/gui.png-atlas' in text:
                          ready = True
                          break
                      time.sleep(1)
              finally:
                  if process.poll() is None:
                      os.killpg(process.pid, signal.SIGTERM)
                  try:
                      process.wait(timeout=15)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
          text = path.read_text(errors='replace')
          if not ready or re.search(r'Exception in thread|ReportedException|ModLoadingException', text):
              print('\n'.join(text.splitlines()[-100:]))
              raise SystemExit(1)
          # Existing unrelated asset issues must not hide errors in the new machinery.
          current = re.compile(r'wayaround:(?:models/(?:block|item)/)?(?:small_|medium_|large_|light_machine|reinforced_machine|plain_machine|copper_machine|narrow_machine|wide_machine|stone_millstones|iron_banded_millstones|iron_machine_support|wooden_machine_support|crushed_|mechanical_mill|pipe_valve|giant_water_pipe|colossal_pipe|iron_water_pipe|thin_gas_pipe|steel_pressure_pipe|insulated_steam_pipe|steam_engine|reforced_blaster)')
          errors = [line for line in text.splitlines() if re.search(r'Failed to load model|Unable to load model|Failed to create model|Missing textures in model', line)]
          relevant = [line for line in errors if current.search(line)]
          if relevant:
              print('\n'.join(relevant))
              raise SystemExit(1)
          print('Client initialized, GUI atlas loaded, and machinery/pipe assets registered without errors')
          PYCLIENT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crusher-runtime-validation
          path: |
            client-smoke.log
            run/logs/latest.log
            build/reports/**
