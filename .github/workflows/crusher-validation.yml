name: Crusher assembly validation
on:
  push:
    branches: [feature/assembly-crushers-v1]
  pull_request:
    paths:
      - 'src/main/java/net/caravidro/wayaround/industrial/crushing/**'
      - 'src/main/java/net/caravidro/wayaround/industrial/client/CrusherRenderer.java'
      - 'src/main/java/net/caravidro/wayaround/industrial/power/MechanicalMill*'
      - '.github/workflows/crusher-validation.yml'
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assembly GameTests on dedicated server
        run: bash gradlew runCrushingGameTestServer --console=plain
      - name: Client registration and resource smoke
        env:
          ALSOFT_DRIVERS: "null"
        shell: bash
        run: |
          set +e
          timeout 150s xvfb-run -a bash gradlew runClient --console=plain > client-smoke.log 2>&1
          result=$?
          set -e
          if [ "$result" != 0 ] && [ "$result" != 124 ]; then
            tail -100 client-smoke.log
            exit "$result"
          fi
          if ! grep -Eq 'OpenAL initialized|Sound engine started' client-smoke.log; then
            tail -100 client-smoke.log
            exit 1
          fi
          if grep -Eq 'Exception in thread|ReportedException|ModLoadingException' client-smoke.log; then
            tail -100 client-smoke.log
            exit 1
          fi
          python - <<'PYMODELS'
          import re
          from pathlib import Path
          text = Path('client-smoke.log').read_text(errors='replace')
          errors = [line for line in text.splitlines() if re.search(r'Failed to load model|Unable to load model|Failed to create model|Missing textures in model', line)]
          current = re.compile(r'wayaround:(?:small_|medium_|large_|light_machine|reinforced_machine|plain_machine|copper_machine|narrow_machine|wide_machine|stone_millstones|iron_banded_millstones|iron_machine_support|wooden_machine_support|crushed_)')
          relevant = [line for line in errors if current.search(line)]
          if relevant:
              print('\n'.join(relevant))
              raise SystemExit(1)
          PYMODELS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crusher-runtime-validation
          path: |
            client-smoke.log
            run/logs/latest.log
            build/reports/**
