name: Regional fish validation
on:
  push:
    branches: [feature/regional-fish-ecology-v1]
  pull_request:
    paths:
      - 'src/main/java/net/caravidro/wayaround/ecology/**'
      - 'src/main/resources/data/wayaround/neoforge/biome_modifier/regional_*'
      - '.github/workflows/fish-validation.yml'
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fish GameTests on dedicated server
        run: bash gradlew runFishGameTestServer --console=plain
      - name: Client registration and resource smoke
        env:
          ALSOFT_DRIVERS: "null"
        shell: bash
        run: |
          python - <<'PYCLIENT'
          import os, re, signal, subprocess, time
          from pathlib import Path
          path = Path('client-smoke.log')
          ready = False
          with path.open('w') as log:
              process = subprocess.Popen(['xvfb-run', '-a', 'bash', 'gradlew', 'runClient', '--console=plain'],
                  stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
              try:
                  deadline = time.monotonic() + 180
                  while process.poll() is None and time.monotonic() < deadline:
                      text = path.read_text(errors='replace')
                      audio = 'OpenAL initialized' in text or 'Sound engine started' in text
                      if audio and 'minecraft:textures/atlas/gui.png-atlas' in text:
                          ready = True
                          break
                      time.sleep(1)
              finally:
                  if process.poll() is None:
                      os.killpg(process.pid, signal.SIGTERM)
                  try:
                      process.wait(timeout=15)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
          text = path.read_text(errors='replace')
          if not ready or re.search(r'Exception in thread|ReportedException|ModLoadingException', text):
              print('\n'.join(text.splitlines()[-100:]))
              raise SystemExit(1)
          # Existing unrelated asset issues must not hide errors in the new fish.
          current = re.compile(r'wayaround:(?:models/(?:block|item)/)?(?:(?:raw_|cooked_)?(?:carp|perch|trout|catfish|archerfish|icefish|toothfish|anglerfish))')
          errors = [line for line in text.splitlines() if re.search(r'Failed to load model|Unable to load model|Failed to create model|Missing textures in model', line)]
          relevant = [line for line in errors if current.search(line)]
          if relevant:
              print('\n'.join(relevant))
              raise SystemExit(1)
          print('Client initialized, GUI atlas loaded, and fish assets registered without errors')
          PYCLIENT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fish-runtime-validation
          path: |
            client-smoke.log
            run/logs/latest.log
            build/reports/**
