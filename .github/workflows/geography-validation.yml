name: Finite geography validation
on:
  pull_request:
    paths:
      - 'src/main/java/net/caravidro/wayaround/worldgen/**'
      - 'src/main/java/net/caravidro/wayaround/worldconfig/**'
      - 'src/main/java/net/caravidro/wayaround/mixin/**'
      - 'src/main/resources/wayaround.mixins.json'
      - 'tests/geography/**'
      - 'build.gradle'
      - '.github/workflows/geography-validation.yml'
jobs:
  geography:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Pure geography and topology
        run: python tests/geography/run_math.py
      - name: Migration, actual visibility and passenger invariants
        shell: bash
        run: |
          set -o pipefail
          bash gradlew runGeographyGameTestServer --console=plain | tee geography-tests.log
          python - <<'PY'
          from pathlib import Path
          text=Path('geography-tests.log').read_text(errors='replace')
          assert 'All 4 required tests passed' in text,text[-16000:]
          PY
      - name: Real seeded terrain on a normal dedicated server
        shell: bash
        run: |
          mkdir -p run-geography
          echo 'eula=true' > run-geography/eula.txt
          echo 'level-seed=7654321' > run-geography/server.properties
          set -o pipefail
          timeout 420s bash gradlew runGeographyValidationServer --console=plain | tee geography-runtime.log
          python - <<'PY'
          from pathlib import Path
          text=Path('geography-runtime.log').read_text(errors='replace')
          assert 'GEOGRAPHY RUNTIME PASSED' in text and 'GEOGRAPHY RUNTIME FAILED' not in text,text[-16000:]
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geography-runtime
          path: |
            geography-tests.log
            geography-runtime.log
