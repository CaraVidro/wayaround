name: Engineering Blueprint Client Smoke

on:
  push:
    branches:
      - feature/engineering-workbench-v1

jobs:
  client-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run client smoke
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          timeout 150s xvfb-run -a ./gradlew runClient --no-daemon > runclient.log 2>&1
          code=$?
          cat runclient.log

          if [ "$code" -eq 124 ]; then
            grep -Eqi "ModLauncher running" runclient.log || exit 1
            grep -Eqi "Backend library: LWJGL" runclient.log || exit 1
            grep -Eqi "Reloading ResourceManager" runclient.log || exit 1

            if grep -Eqi "Missing textures in model wayaround:engineering_blueprint|Unable to load model.*wayaround:engineering_blueprint|Exception.*(EngineeringBlueprint|BlueprintLabel|EngineeringWorkbenchScreen)|Payload.*engineering_blueprint.*(error|duplicate|fail)" runclient.log; then
              echo "Blueprint client/network error detected."
              exit 1
            fi

            echo "Engineering Blueprint client smoke passed."
            exit 0
          fi

          exit "$code"
