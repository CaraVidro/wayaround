name: Little Leaf World runtime validation
on:
  pull_request:
    paths:
      - 'src/main/java/net/caravidro/wayaround/littleleaf/**'
      - 'src/main/java/net/caravidro/wayaround/worldconfig/WorldFeature.java'
      - 'src/main/java/net/caravidro/wayaround/worldgen/WorldgenRegistry.java'
      - 'src/main/resources/data/wayaround/dimension*/little_leaf_world.json'
      - 'src/main/resources/data/wayaround/worldgen/biome/colony_gardens.json'
      - 'src/main/resources/assets/wayaround/**/colony_*.json'
      - 'src/main/resources/data/wayaround/**/colony_*.json'
      - 'src/main/resources/wayaround.mixins.json'
      - 'tests/littleleaf/**'
      - 'build.gradle'
      - '.github/workflows/littleleaf-validation.yml'
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Bounded colony lifecycle and tunnel contracts
        run: |
          mkdir -p /tmp/littleleaf-classes
          javac -d /tmp/littleleaf-classes src/main/java/net/caravidro/wayaround/littleleaf/ColonyRules.java src/main/java/net/caravidro/wayaround/littleleaf/world/ColonyLayout.java tests/littleleaf/ColonyRulesTest.java
          java -cp /tmp/littleleaf-classes ColonyRulesTest
      - name: Actual colony, inversion, dimension and persistence checks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'level-seed=42\n' > run/server.properties
          timeout 300s bash gradlew runLittleLeafValidationServer --console=plain | tee littleleaf-server-tests.log
          python - <<'PYTESTS'
          from pathlib import Path
          text=Path('littleleaf-server-tests.log').read_text(errors='replace')
          assert 'LITTLE LEAF VALIDATION: all 14 checks passed' in text,text[-16000:]
          assert 'ModLoadingException' not in text and 'Exception caught during firing event' not in text,text[-16000:]
          PYTESTS
      - name: Client boot and mixin application
        env:
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          python - <<'PYCLIENT'
          import os,re,signal,subprocess,time
          from pathlib import Path
          path=Path('littleleaf-client-smoke.log')
          ready=False
          with path.open('w') as log:
              process=subprocess.Popen(['xvfb-run','-a','bash','gradlew','runClient','--console=plain'],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
              try:
                  deadline=time.monotonic()+240
                  while process.poll() is None and time.monotonic()<deadline:
                      text=path.read_text(errors='replace')
                      if ('OpenAL initialized' in text or 'Sound engine started' in text) and 'minecraft:textures/atlas/gui.png-atlas' in text:
                          ready=True
                          break
                      time.sleep(1)
              finally:
                  if process.poll() is None: os.killpg(process.pid,signal.SIGTERM)
                  try: process.wait(timeout=15)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid,signal.SIGKILL);process.wait()
          text=path.read_text(errors='replace')
          if not ready or re.search(r'Exception in thread|ReportedException|ModLoadingException|Mixin apply failed|InvalidInjectionException',text):
              print('\n'.join(text.splitlines()[-120:]));raise SystemExit(1)
          relevant=[line for line in text.splitlines() if re.search(r'Failed to load model|Unable to load model|Failed to create model|Missing textures in model',line) and 'wayaround:' in line]
          if relevant:
              print('\n'.join(relevant));raise SystemExit(1)
          print('Client boot and Little Leaf resources passed. In-world colony/model visual QA remains manual.')
          PYCLIENT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: littleleaf-runtime
          path: |
            littleleaf-client-smoke.log
            littleleaf-server-tests.log
