name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build compactSourceArchive

      - name: Dedicated server smoke test
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt

          ./gradlew runServer --no-daemon > dedicated-server.log 2>&1 &
          server_pid=$!

          ready=0
          for _ in $(seq 1 90); do
            if grep -Eq 'Done \\([0-9.]+s\\)!|For help, type "help"' dedicated-server.log; then
              ready=1
              break
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi

            sleep 2
          done

          cat dedicated-server.log

          if kill -0 "$server_pid" 2>/dev/null; then
            kill "$server_pid" || true
            sleep 2
            kill -9 "$server_pid" 2>/dev/null || true
          fi

          if [ "$ready" -ne 1 ]; then
            echo 'Dedicated server did not reach the ready state.'
            exit 1
          fi

          echo 'Dedicated server reached the ready state without loading client-only classes.'

      - name: Upload test build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wayaround-1.0.5
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload compact source project
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wayaround-source-project
          path: build/distributions/*-source-project.zip
          if-no-files-found: error
