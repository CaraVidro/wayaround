name: Build

on: [push, pull_request]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Dedicated server smoke test
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout 90s ./gradlew runServer --no-daemon > server-smoke.log 2>&1
          code=$?
          set -e
          cat server-smoke.log

          if grep -Eq 'Done \([0-9.]+s\)! For help' server-smoke.log; then
            echo "Dedicated server reached ready state."
            exit 0
          fi

          echo "Dedicated server did not reach ready state (exit=$code)."
          exit 1

      - name: Upload test build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wayaround-1.2.0
          path: build/libs/*.jar
          if-no-files-found: error