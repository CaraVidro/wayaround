name: Runtime appearance validation
on:
  pull_request:
    paths:
      - 'src/main/java/net/caravidro/wayaround/appearance/**'
      - 'src/main/java/net/caravidro/wayaround/client/SurfaceAppearanceRenderer.java'
      - 'src/main/java/net/caravidro/wayaround/network/PuddleDebugS2CPayload.java'
      - 'tests/appearance/**'
      - '.github/workflows/appearance-validation.yml'

jobs:
  puddle-stencil:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Deterministic, bounded, irregular puddle silhouettes
        run: |
          mkdir -p /tmp/wayaround-appearance
          javac -d /tmp/wayaround-appearance src/main/java/net/caravidro/wayaround/appearance/PuddleSilhouette.java tests/appearance/PuddleSilhouetteTest.java
          java -cp /tmp/wayaround-appearance PuddleSilhouetteTest
