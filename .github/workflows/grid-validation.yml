name: The Grid and polar polish validation

on:
  pull_request:
    paths:
      - 'src/main/java/net/caravidro/wayaround/industrial/grid/**'
      - 'src/main/java/net/caravidro/wayaround/industrial/power/EnergyNetwork.java'
      - 'src/main/java/net/caravidro/wayaround/industrial/power/EnergyCableBlock.java'
      - 'src/main/java/net/caravidro/wayaround/industrial/power/PowerContent.java'
      - 'src/main/java/net/caravidro/wayaround/client/TitleScreenUpdateLogEvents.java'
      - 'src/main/java/net/caravidro/wayaround/client/WayAroundUpdateLogScreen.java'
      - 'src/main/java/net/caravidro/wayaround/mixin/client/TitleScreenBrandingMixin.java'
      - 'src/main/java/net/caravidro/wayaround/client/AntarcticClientLighting.java'
      - 'src/main/java/net/caravidro/wayaround/client/AntarcticBreeze.java'
      - 'src/main/java/net/caravidro/wayaround/mixin/client/Antarctic*.java'
      - 'src/main/java/net/caravidro/wayaround/worldgen/geography/AntarcticField.java'
      - 'src/main/java/net/caravidro/wayaround/worldgen/weather/cold/AntarcticCold.java'
      - 'src/main/java/net/caravidro/wayaround/advancement/**'
      - 'src/main/resources/data/wayaround/advancement/vista/**'
      - 'src/main/resources/assets/wayaround/models/block/high_voltage_*'
      - 'src/main/resources/assets/wayaround/models/block/transformer.json'
      - 'src/main/resources/assets/wayaround/models/block/fuse_box.json'
      - 'src/main/resources/assets/wayaround/models/block/electric_motor.json'
      - 'src/main/resources/assets/wayaround/models/block/utility_pole.json'
      - 'src/main/resources/assets/wayaround/models/item/high_voltage_*'
      - 'src/main/resources/assets/wayaround/models/item/transformer.json'
      - 'src/main/resources/assets/wayaround/models/item/fuse_box.json'
      - 'src/main/resources/assets/wayaround/models/item/electric_motor.json'
      - 'src/main/resources/assets/wayaround/models/item/utility_pole.json'
      - '.github/workflows/grid-validation.yml'

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Grid and polar GameTests
        run: bash gradlew runCrushingGameTestServer --console=plain

      - name: Grid and responsive-title client smoke
        env:
          ALSOFT_DRIVERS: "null"
        shell: bash
        run: |
          python - <<'PYCLIENT'
          import os, re, signal, subprocess, time
          from pathlib import Path

          path = Path('grid-client-smoke.log')
          ready = False

          with path.open('w') as log:
              process = subprocess.Popen(
                  ['xvfb-run', '-a', 'bash', 'gradlew', 'runClient', '--console=plain'],
                  stdout=log,
                  stderr=subprocess.STDOUT,
                  start_new_session=True,
              )
              try:
                  deadline = time.monotonic() + 180
                  while process.poll() is None and time.monotonic() < deadline:
                      text = path.read_text(errors='replace')
                      audio = 'OpenAL initialized' in text or 'Sound engine started' in text
                      if audio and 'minecraft:textures/atlas/gui.png-atlas' in text:
                          ready = True
                          break
                      time.sleep(1)
              finally:
                  if process.poll() is None:
                      os.killpg(process.pid, signal.SIGTERM)
                  try:
                      process.wait(timeout=15)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()

          text = path.read_text(errors='replace')

          if not ready or re.search(r'Exception in thread|ReportedException|ModLoadingException', text):
              print('\n'.join(text.splitlines()[-160:]))
              raise SystemExit(1)

          grid = re.compile(
              r'wayaround:(?:models/(?:block|item)/)?'
              r'(?:high_voltage_line|transformer|fuse_box|electric_motor|utility_pole)'
          )

          errors = [
              line for line in text.splitlines()
              if re.search(
                  r'Failed to load model|Unable to load model|Failed to create model|Missing textures in model',
                  line,
              )
          ]

          relevant = [line for line in errors if grid.search(line)]

          if relevant:
              print('\n'.join(relevant))
              raise SystemExit(1)

          print('The Grid / polar GameTests and client smoke reached a clean initialized state')
          PYCLIENT

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grid-polar-validation
          path: |
            grid-client-smoke.log
            run/logs/latest.log
            build/reports/**
