name: Vegetation and Kraken runtime validation
on:
  pull_request:
    paths:
      - 'src/main/java/net/caravidro/wayaround/ecology/Kraken*'
      - 'src/main/java/net/caravidro/wayaround/ecology/client/Kraken*'
      - 'src/main/java/net/caravidro/wayaround/client/SimpleDynamicLights.java'
      - 'src/main/java/net/caravidro/wayaround/client/weather/CloudShadowRenderer.java'
      - 'src/main/java/net/caravidro/wayaround/mixin/client/Kraken*'
      - 'src/main/java/net/caravidro/wayaround/mixin/client/SimpleDynamic*'
      - 'src/main/java/net/caravidro/wayaround/client/*LeavesModel.java'
      - 'src/main/java/net/caravidro/wayaround/client/ConnectedTreeModel.java'
      - 'src/main/java/net/caravidro/wayaround/client/VegetationLod*.java'
      - 'src/main/java/net/caravidro/wayaround/mixin/client/VegetationLodMixin.java'
      - 'src/main/resources/wayaround.mixins.json'
      - 'src/main/resources/assets/wayaround/models/**'
      - 'tests/visuals/**'
      - 'tests/kraken/**'
      - '.github/workflows/kraken-validation.yml'
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Deterministic motion and splash contacts
        run: |
          mkdir -p /tmp/kraken-classes
          javac -d /tmp/kraken-classes src/main/java/net/caravidro/wayaround/ecology/KrakenMotion.java tests/kraken/KrakenMotionTest.java src/main/java/net/caravidro/wayaround/ecology/KrakenAnimationClock.java src/main/java/net/caravidro/wayaround/client/VegetationLodMath.java tests/visuals/VisualTimingTest.java
          java -cp /tmp/kraken-classes KrakenMotionTest
          java -cp /tmp/kraken-classes VisualTimingTest
      - name: Client boot and mixin application
        env:
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          python - <<'PYCLIENT'
          import os,re,signal,subprocess,time
          from pathlib import Path
          path=Path('kraken-client-smoke.log')
          ready=False
          with path.open('w') as log:
              process=subprocess.Popen(['xvfb-run','-a','bash','gradlew','runClient','--console=plain'],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
              try:
                  deadline=time.monotonic()+240
                  while process.poll() is None and time.monotonic()<deadline:
                      text=path.read_text(errors='replace')
                      if ('OpenAL initialized' in text or 'Sound engine started' in text) and 'minecraft:textures/atlas/gui.png-atlas' in text:
                          ready=True
                          break
                      time.sleep(1)
              finally:
                  if process.poll() is None: os.killpg(process.pid,signal.SIGTERM)
                  try: process.wait(timeout=15)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid,signal.SIGKILL);process.wait()
          text=path.read_text(errors='replace')
          if not ready or re.search(r'Exception in thread|ReportedException|ModLoadingException|Mixin apply failed|InvalidInjectionException',text):
              print('\n'.join(text.splitlines()[-120:]));raise SystemExit(1)
          for mixin in ['PlayerStepSoundMixin','client.VegetationLodMixin']:
              assert 'Mixing '+mixin+' from wayaround.mixins.json' in text,'Mixin not exercised: '+mixin
          missing=[line for line in text.splitlines() if 'Missing textures in model wayaround:' in line]
          assert not missing,'\n'.join(missing)
          print('Client boot, vegetation/step mixins and all mod model textures passed. In-world visual/audio QA remains manual.')
          PYCLIENT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kraken-client-runtime
          path: kraken-client-smoke.log
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7689ce593c8e8e418d3262b5d3fcc89393cee4b4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compare pre-existing pump tests on unchanged base
        shell: bash
        run: |
          set +e
          bash gradlew runFishGameTestServer --console=plain > kraken-baseline-tests.log 2>&1
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo 'Base suite passed; current branch failures require investigation.'
            exit 1
          fi
          python - <<'PYBASE'
          from pathlib import Path
          import re
          text=Path('kraken-baseline-tests.log').read_text(errors='replace')
          names=['crankactuallydrivesmechanicalpump','largerotaryliftmovesonerealsource','narrowrotaryliftisvisualonly']
          observed=set(re.findall(r'LogTestReporter\]: ([a-z0-9_]+) failed',text))
          assert observed and observed.issubset(set(names)),text[-12000:]
          print('Unchanged base reproduces known hydraulic failures:', ', '.join(sorted(observed)))
          PYBASE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kraken-unchanged-base-comparison
          path: kraken-baseline-tests.log
