name: Regional cloud runtime validation
on:
  pull_request:
    paths:
      - 'src/main/java/net/caravidro/wayaround/worldgen/weather/local/**'
      - 'src/main/java/net/caravidro/wayaround/client/weather/**'
      - 'src/main/java/net/caravidro/wayaround/network/CloudStorm*'
      - 'src/main/java/net/caravidro/wayaround/client/weather/CloudShadowRenderer.java'
      - 'src/main/java/net/caravidro/wayaround/mixin/client/Kraken*'
      - 'src/main/java/net/caravidro/wayaround/mixin/client/SimpleDynamic*'
      - 'tests/clouds/**'
      - 'tests/weather/**'
      - '.github/workflows/cloud-validation.yml'
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Humidity, lightning delay and gust invariants
        run: |
          mkdir -p /tmp/cloud-classes
          javac -d /tmp/cloud-classes src/main/java/net/caravidro/wayaround/worldgen/weather/local/CloudStormMath.java tests/clouds/CloudStormMathTest.java
          java -cp /tmp/cloud-classes CloudStormMathTest
      - name: Weather search equivalence against prior revision
        run: python tests/weather/weather_equivalence.py
      - name: Client boot and mixin application
        env:
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          python - <<'PYCLIENT'
          import os,re,signal,subprocess,time
          from pathlib import Path
          path=Path('cloud-client-smoke.log')
          ready=False
          with path.open('w') as log:
              process=subprocess.Popen(['xvfb-run','-a','bash','gradlew','runClient','--console=plain'],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
              try:
                  deadline=time.monotonic()+240
                  while process.poll() is None and time.monotonic()<deadline:
                      text=path.read_text(errors='replace')
                      if ('OpenAL initialized' in text or 'Sound engine started' in text) and 'minecraft:textures/atlas/gui.png-atlas' in text:
                          ready=True
                          break
                      time.sleep(1)
              finally:
                  if process.poll() is None: os.killpg(process.pid,signal.SIGTERM)
                  try: process.wait(timeout=15)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid,signal.SIGKILL);process.wait()
          text=path.read_text(errors='replace')
          if not ready or re.search(r'Exception in thread|ReportedException|ModLoadingException|Mixin apply failed|InvalidInjectionException',text):
              print('\n'.join(text.splitlines()[-120:]));raise SystemExit(1)
          print('Client boot and cloud event/precipitation registration passed. In-world visual QA remains manual.')
          PYCLIENT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-client-runtime
          path: cloud-client-smoke.log
