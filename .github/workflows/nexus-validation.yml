name: Fractured Nexus runtime validation
on:
  pull_request:
    paths:
      - 'src/main/java/net/caravidro/wayaround/nexus/**'
      - 'src/main/java/net/caravidro/wayaround/mixin/client/Nexus*'
      - 'src/main/java/net/caravidro/wayaround/worldgen/WorldgenRegistry.java'
      - 'src/main/resources/data/wayaround/dimension*/nexus.json'
      - 'src/main/resources/data/wayaround/worldgen/biome/nexus_caverns.json'
      - 'src/main/resources/assets/wayaround/**/nexus_control.json'
      - 'src/main/resources/wayaround.mixins.json'
      - 'tests/nexus/**'
      - 'build.gradle'
      - '.github/workflows/nexus-validation.yml'
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Connected seed-based room contracts
        run: |
          mkdir -p /tmp/nexus-classes
          javac -d /tmp/nexus-classes src/main/java/net/caravidro/wayaround/nexus/world/NexusLayout.java tests/nexus/NexusLayoutTest.java
          java -cp /tmp/nexus-classes NexusLayoutTest
      - name: Actual dimension, furniture and saved-transit tests
        shell: bash
        run: |
          set -o pipefail
          bash gradlew runNexusGameTestServer --console=plain | tee nexus-server-tests.log
          python - <<'PYTESTS'
          from pathlib import Path
          text=Path('nexus-server-tests.log').read_text(errors='replace')
          assert 'All 4 required tests passed' in text,text[-16000:]
          assert 'ModLoadingException' not in text and 'Exception caught during firing event' not in text,text[-16000:]
          PYTESTS
      - name: Client boot and mixin application
        env:
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          python - <<'PYCLIENT'
          import os,re,signal,subprocess,time
          from pathlib import Path
          path=Path('nexus-client-smoke.log')
          ready=False
          with path.open('w') as log:
              process=subprocess.Popen(['xvfb-run','-a','bash','gradlew','runClient','--console=plain'],stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
              try:
                  deadline=time.monotonic()+240
                  while process.poll() is None and time.monotonic()<deadline:
                      text=path.read_text(errors='replace')
                      if ('OpenAL initialized' in text or 'Sound engine started' in text) and 'minecraft:textures/atlas/gui.png-atlas' in text:
                          ready=True
                          break
                      time.sleep(1)
              finally:
                  if process.poll() is None: os.killpg(process.pid,signal.SIGTERM)
                  try: process.wait(timeout=15)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid,signal.SIGKILL);process.wait()
          text=path.read_text(errors='replace')
          if not ready or re.search(r'Exception in thread|ReportedException|ModLoadingException|Mixin apply failed|InvalidInjectionException',text):
              print('\n'.join(text.splitlines()[-120:]));raise SystemExit(1)
          relevant=[line for line in text.splitlines() if re.search(r'Failed to load model|Unable to load model|Failed to create model|Missing textures in model',line) and 'wayaround:' in line]
          if relevant:
              print('\n'.join(relevant));raise SystemExit(1)
          print('Client boot and Nexus mixins/resources passed. In-world sky/room visual QA remains manual.')
          PYCLIENT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-runtime
          path: |
            nexus-client-smoke.log
            nexus-server-tests.log
