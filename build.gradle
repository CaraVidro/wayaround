// Applied at build time only. Preserve standard JAR resource paths and registry stability.
// Assemble waits for verified compaction; a failed jar task never runs the optimizer.
def compactJar = tasks.register('compactJar', JavaExec) {
    dependsOn tasks.named('jar'), tasks.named('packagingToolsClasses')
    classpath = sourceSets.packagingTools.runtimeClasspath
    mainClass = 'CompactArchive'
    args tasks.named('jar').get().archiveFile.get().asFile.absolutePath
}
tasks.named('assemble') { dependsOn compactJar }

// Optional portable archive of the raw project; leaves the working checkout editable.
tasks.register('compactSources', Zip) {
    archiveClassifier = 'source-project'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from('.') {
        include 'src/**', 'docs/**', 'tools/**', 'gradle/**', '.github/**'
        include '*.gradle', 'gradle.properties', 'gradlew', 'gradlew.bat', 'README.md', 'AGENTS.md', 'LICENSE*'
        exclude '**/*.local.ogg', '**/.cache/**', '**/__pycache__/**'
    }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.register('compactSourceArchive', JavaExec) {
    dependsOn tasks.named('compactSources'), tasks.named('packagingToolsClasses')
    classpath = sourceSets.packagingTools.runtimeClasspath
    mainClass = 'CompactArchive'
    args tasks.named('compactSources').get().archiveFile.get().asFile.absolutePath
}
